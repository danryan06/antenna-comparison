<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Antenna Details — AntennaComparison</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin: 1rem 0 1.5rem;
    }
    .gallery-item {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .gallery-item button.gallery-zoom {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      cursor: zoom-in;
      border-radius: 8px;
    }
    .gallery-item button.gallery-zoom:focus {
      outline: none;
    }
    .gallery-item button.gallery-zoom:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 3px;
    }
    .gallery-item img {
      max-width: 100%;
      max-height: 280px;
      object-fit: contain;
      border-radius: 8px;
      background: #fff;
      display: block;
      margin: 0 auto;
    }
    .gallery-item.pattern img,
    .gallery-item.dimension img {
      background: #0b1220;
    }
    .gallery-caption {
      margin-top: 8px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.65);
    }
    .ap-image-wrapper {
      position: relative;
    }
    .ap-image-zoom {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: none;
      background: transparent;
      cursor: zoom-in;
    }
    .ap-image-zoom:focus {
      outline: none;
    }
    .ap-image-zoom:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 3px;
      border-radius: 0.75rem;
    }
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      background: rgba(2, 6, 23, 0.88);
      backdrop-filter: blur(4px);
    }
    .lightbox-overlay.is-open {
      display: flex;
    }
    .lightbox-dialog {
      position: relative;
      max-width: min(1100px, 100%);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }
    .lightbox-dialog img {
      max-width: 100%;
      max-height: calc(90vh - 3.5rem);
      object-fit: contain;
      border-radius: 10px;
      background: #020617;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .lightbox-caption {
      margin: 0;
      max-width: 42rem;
      text-align: center;
      color: #e5e7eb;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .lightbox-close {
      position: absolute;
      top: -0.35rem;
      right: -0.35rem;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.35);
      background: rgba(15, 23, 42, 0.95);
      color: #e5e7eb;
      font-size: 1.25rem;
      line-height: 1;
      cursor: pointer;
    }
    .lightbox-close:hover {
      background: rgba(30, 41, 59, 0.98);
      color: #fff;
    }
    .lightbox-close:focus {
      outline: none;
    }
    .lightbox-close:focus-visible {
      outline: 2px solid #60a5fa;
      outline-offset: 2px;
    }
    body.lightbox-open {
      overflow: hidden;
    }
    .legacy-sku {
      margin-top: -0.85rem;
      margin-bottom: 1.35rem;
      font-size: 0.9rem;
      line-height: 1.45;
      color: #9ca3af;
    }
    .legacy-sku-label {
      color: #9ca3af;
    }
    .legacy-sku-value {
      color: #e5e7eb;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .legacy-sku-row,
    .val-with-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      min-width: 0;
      vertical-align: middle;
    }
    .legacy-sku-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
    }
    .val-with-copy .part-text,
    .legacy-sku-row .legacy-sku-value {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .val-with-copy .part-text {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    #title-header {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.25;
      color: #f8fafc;
      overflow-wrap: anywhere;
    }
    .header-with-logo {
      align-items: flex-start;
    }
    .part-numbers {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.15rem;
      margin: 0.85rem 0 1.35rem;
      max-width: 48rem;
    }
    .part-number-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.35rem 0.55rem;
      max-width: 100%;
      /* Same UI sans as the specs grid, a step larger than .kv-grid .val (0.9rem). */
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1.05rem;
      font-weight: 400;
      letter-spacing: normal;
      line-height: 1.45;
    }
    .part-number-label,
    .part-number-value {
      font-family: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
    }
    .part-number-label {
      color: #cbd5e1;
    }
    .part-number-value {
      color: #e5e7eb;
      overflow-wrap: anywhere;
    }
    @media (max-width: 480px) {
      #title-header {
        font-size: 1.5rem;
      }
    }
    .notes-list {
      margin: 0.5rem 0 0;
      padding-left: 1.1rem;
      color: rgba(255,255,255,0.75);
      font-size: 0.9rem;
    }
    .notes-list a {
      color: var(--link, #93c5fd);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.18em;
      text-decoration-color: var(--link-underline, rgba(147, 197, 253, 0.55));
    }
    .notes-list a:hover {
      color: var(--link-hover, #dbeafe);
      text-decoration-color: var(--link-underline-hover, rgba(219, 234, 254, 0.85));
    }
    .notes-list a:focus {
      outline: none;
    }
    .notes-list a:focus-visible {
      color: var(--link-focus, #eff6ff);
      outline: 2px solid #60a5fa;
      outline-offset: 3px;
      border-radius: 2px;
      text-decoration-color: var(--link-focus, #eff6ff);
    }
    /* Clear break after specs before body sections */
    #details.kv-grid {
      padding-bottom: 0.25rem;
    }
    #included:not(:empty) {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(148, 163, 184, 0.28);
    }
    #patterns:not(:empty),
    #dimensions:not(:empty),
    #photos:not(:empty),
    #sources:not(:empty) {
      margin-top: 1.25rem;
    }
    #patterns .spec-section:first-child,
    #dimensions .spec-section:first-child,
    #photos .spec-section:first-child,
    #included .spec-section:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="actions">
      <a id="back-link" class="btn-link" href="index.html">&larr; Back to Antenna Table</a>
      <a id="edit-link" class="btn-link" href="edit.html" style="display:none;">Edit this antenna</a>
      <button id="export-csv" type="button" class="btn-link">Export CSV</button>
    </div>

    <div class="card">
      <span class="badge">Antenna Details</span>

      <div class="header-with-logo">
        <h1 id="title-header">Antenna Details</h1>
        <img src="logo.png" alt="AntennaComparison" class="site-logo" />
      </div>
      <div id="part-numbers" class="part-numbers"></div>

      <div id="image-container" class="ap-image-wrapper" style="display:none;">
        <button type="button" id="hero-zoom" class="ap-image-zoom" aria-label="Expand product photo" hidden>
          <img id="antenna-image" class="ap-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" loading="lazy" />
        </button>
      </div>

      <div id="actions-inline"></div>
      <div id="details" class="kv-grid"></div>
      <div id="included"></div>
      <div id="patterns"></div>
      <div id="dimensions"></div>
      <div id="photos"></div>
      <div id="sources"></div>

      <div id="error-message" class="error" style="display:none;"></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox-overlay" hidden>
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-labelledby="lightbox-caption">
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close image">&times;</button>
      <img id="lightbox-image" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="" />
      <p id="lightbox-caption" class="lightbox-caption"></p>
    </div>
  </div>

  <script src="antenna-format.js"></script>
  <script>
    const DATA_URL = 'antenna_data.json';
    let currentEntry = null;

    const PUBLIC_FIELDS = [
      ['vendor', 'Vendor'],
      ['sku', 'SKU (primary)'],
      ['legacy_sku', 'Legacy SKU'],
      ['name', 'Name'],
      ['form', 'Form'],
      ['indoor_outdoor', 'Indoor/Outdoor'],
      ['bands', 'Bands'],
      ['frequency_range', 'Frequency Range'],
      ['gain_dbi', 'Gain (dBi)'],
      ['beamwidth', 'Beamwidth'],
      ['connector', 'Connector'],
      ['lead_count', 'Lead Count'],
      ['polarization', 'Polarization'],
      ['cable_length', 'Cable Length'],
      ['cable_type', 'Cable Type'],
      ['dimensions', 'Dimensions'],
      ['weight', 'Weight'],
      ['ip_rating', 'IP Rating'],
      ['radome', 'Radome'],
      ['mount_type', 'Mount / Install Type'],
      ['wind_rating', 'Wind Rating'],
      ['vswr', 'VSWR'],
      ['isolation', 'Isolation'],
      ['operating_temp', 'Operating Temperature']
    ];

    // Never render these in the UI (maintainer / merge notes only)
    const INTERNAL_ONLY_KEYS = new Set(['internal_notes', 'compatible_aps', 'field_notes']);
    const COPYABLE_SKU_KEYS = new Set(['sku', 'legacy_sku']);
    const COPY_ICON = '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>';
    const CHECK_ICON = '<path d="M20 6 9 17l-5-5"/>';

    function readId() {
      return new URLSearchParams(window.location.search).get('id') || '';
    }

    function iconSvg(markup, size) {
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', String(size));
      svg.setAttribute('height', String(size));
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '2');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
      svg.setAttribute('aria-hidden', 'true');
      svg.innerHTML = markup;
      return svg;
    }

    function copyAnnouncer() {
      let live = document.getElementById('copy-status');
      if (live) return live;
      live = document.createElement('div');
      live.id = 'copy-status';
      live.className = 'visually-hidden';
      live.setAttribute('aria-live', 'polite');
      document.body.appendChild(live);
      return live;
    }

    function copyPartNumber(text, button) {
      const value = String(text || '').trim();
      if (!value) return;
      const clipboard = navigator.clipboard;
      if (!clipboard || typeof clipboard.writeText !== 'function') return;
      let pending;
      try {
        pending = clipboard.writeText(value);
      } catch (err) {
        return;
      }
      Promise.resolve(pending).then(() => {
        const svg = button.querySelector('svg');
        button.classList.add('is-copied');
        button.setAttribute('aria-label', `Copied ${value}`);
        if (svg) svg.innerHTML = CHECK_ICON;
        const live = copyAnnouncer();
        live.textContent = '';
        window.setTimeout(() => { live.textContent = 'Copied'; }, 30);
        window.clearTimeout(button._copyTimer);
        button._copyTimer = window.setTimeout(() => {
          button.classList.remove('is-copied');
          button.setAttribute('aria-label', `Copy ${value}`);
          if (svg) svg.innerHTML = COPY_ICON;
        }, 1500);
      }, () => {});
    }

    function createCopyButton(text) {
      const value = String(text || '').trim();
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'copy-part';
      button.setAttribute('aria-label', `Copy ${value}`);
      button.title = `Copy ${value}`;
      button.appendChild(iconSvg(COPY_ICON, 16));
      button.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        copyPartNumber(value, button);
      });
      return button;
    }

    function appendCopyableSku(container, text) {
      const value = String(text || '').trim();
      const part = document.createElement('span');
      part.className = 'part-text';
      part.textContent = value;
      container.appendChild(part);
      if (value) container.appendChild(createCopyButton(value));
    }

    function addPartNumber(container, value, label) {
      const text = String(value || '').trim();
      if (!text) return;
      const row = document.createElement('div');
      row.className = 'part-number-row';
      if (label) {
        const labelEl = document.createElement('span');
        labelEl.className = 'part-number-label';
        labelEl.textContent = label;
        row.appendChild(labelEl);
      }
      const valueEl = document.createElement('span');
      valueEl.className = 'part-number-value';
      valueEl.textContent = text;
      row.append(valueEl, createCopyButton(text));
      container.appendChild(row);
    }

    function normalizeString(value) {
      if (value == null) return '';
      if (Array.isArray(value)) return value.join(', ');
      return String(value);
    }

    function formatField(key, value) {
      if (key === 'bands') return formatBands(value);
      if (key === 'gain_dbi') return formatGainCompact(value) || formatBandObject(value, 'gain');
      if (key === 'beamwidth') return formatBeamwidthCompact(value) || formatBandObject(value, 'beam');
      if (Array.isArray(value)) return value.join('; ');
      if (value && typeof value === 'object') return JSON.stringify(value);
      return normalizeString(value);
    }

    function escapeCsvValue(value) {
      const s = String(value || '');
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function exportToCsv() {
      if (!currentEntry) return;
      const keys = PUBLIC_FIELDS.map(([k]) => k).filter(k => Object.prototype.hasOwnProperty.call(currentEntry, k));
      const headers = keys.map(escapeCsvValue);
      const values = keys.map(k => escapeCsvValue(formatField(k, currentEntry[k])));
      const blob = new Blob([headers.join(',') + '\n' + values.join(',')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = slugifyAntenna(currentEntry) + '.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function normalizeImageKey(url) {
      if (!url) return '';
      try {
        const u = new URL(url, window.location.href);
        return decodeURIComponent(u.pathname).replace(/\/+$/, '').toLowerCase();
      } catch (_) {
        return String(url).split('?')[0].split('#')[0].replace(/\/+$/, '').toLowerCase();
      }
    }

    function openLightbox(src, caption) {
      const overlay = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-image');
      const cap = document.getElementById('lightbox-caption');
      img.src = src;
      img.alt = caption || '';
      cap.textContent = caption || '';
      overlay.hidden = false;
      overlay.classList.add('is-open');
      document.body.classList.add('lightbox-open');
      document.getElementById('lightbox-close').focus();
    }

    function closeLightbox() {
      const overlay = document.getElementById('lightbox');
      if (overlay.hidden) return;
      overlay.classList.remove('is-open');
      overlay.hidden = true;
      document.body.classList.remove('lightbox-open');
      const img = document.getElementById('lightbox-image');
      img.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      img.alt = '';
      document.getElementById('lightbox-caption').textContent = '';
    }

    function bindLightboxControls() {
      const overlay = document.getElementById('lightbox');
      document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
      });
    }

    function addGallery(container, title, items, kind) {
      if (!items || !items.length) return;
      const ordered = kind === 'pattern' && typeof sortPatternImages === 'function'
        ? sortPatternImages(items)
        : items;
      const section = document.createElement('div');
      section.className = 'spec-section';
      const h = document.createElement('h3');
      h.textContent = title;
      section.appendChild(h);
      const grid = document.createElement('div');
      grid.className = 'gallery-grid';
      ordered.forEach(item => {
        const url = safeUrl(item.url || item, { allowRelative: true });
        if (!url) return;
        const fig = document.createElement('figure');
        fig.className = 'gallery-item ' + (kind || '');
        const displayLabel = kind === 'pattern'
          ? formatPatternCaption(item.label)
          : (item.label || '');
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gallery-zoom';
        btn.setAttribute('aria-label', displayLabel ? `Expand ${displayLabel}` : `Expand ${title}`);
        const img = document.createElement('img');
        img.src = url;
        img.alt = displayLabel || title;
        img.loading = 'lazy';
        btn.appendChild(img);
        btn.addEventListener('click', () => openLightbox(url, displayLabel || title));
        fig.appendChild(btn);
        if (displayLabel) {
          const cap = document.createElement('figcaption');
          cap.className = 'gallery-caption';
          cap.textContent = displayLabel;
          fig.appendChild(cap);
        }
        grid.appendChild(fig);
      });
      if (!grid.children.length) return;
      section.appendChild(grid);
      container.appendChild(section);
    }

    function dimensionImageKind(entry) {
      // Require an explicit kind. Unlabeled dimension_image_url must not default to
      // "Mechanical drawing" (that hid product photos under Dimensions).
      const kind = entry && entry.dimension_image_kind;
      if (kind === 'assembly' || kind === 'assembly_render') return 'assembly';
      if (kind === 'mechanical' || kind === 'mechanical_drawing') return 'mechanical';
      return null;
    }

    function sanitizePhotoCaption(label) {
      const raw = (label == null ? '' : String(label)).trim();
      if (!raw) return 'Product photo';
      const low = raw.toLowerCase();
      if (low === 'product' || low === 'additional photo' || /^product\s*\(/.test(low)) {
        return 'Product photo';
      }
      // Drop awkward source tags: "Front angle (AccelTex sheet)" → "Front angle"
      const stripped = raw.replace(
        /\s*\((?:datasheet|hubbell(?:\s+spec|\s+cdn)?|acceltex(?:\s+sheet)?)\)\s*$/i,
        ''
      ).trim();
      return stripped || 'Product photo';
    }

    function extraProductPhotos(entry) {
      const photos = Array.isArray(entry.images) ? entry.images.slice() : [];
      const dimUrl = safeUrl(entry.dimension_image_url, { allowRelative: true });
      if (dimUrl && dimensionImageKind(entry) === 'assembly') {
        const dimKey = normalizeImageKey(dimUrl);
        const already = photos.some(item => {
          const url = safeUrl(item && (item.url || item), { allowRelative: true });
          return url && normalizeImageKey(url) === dimKey;
        });
        if (!already) {
          photos.push({ label: 'Assembly view', url: entry.dimension_image_url });
        }
      }
      const heroKey = normalizeImageKey(safeUrl(entry.image_url, { allowRelative: true }));
      const seen = new Set();
      return photos.filter(item => {
        const url = safeUrl(item && (item.url || item), { allowRelative: true });
        if (!url) return false;
        const key = normalizeImageKey(url);
        if (heroKey && key === heroKey) return false;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).map(item => {
        if (!item || typeof item !== 'object') {
          return { label: 'Product photo', url: item };
        }
        return {
          label: item.label === 'Assembly view' ? 'Assembly view' : sanitizePhotoCaption(item.label),
          url: item.url
        };
      });
    }

    async function load() {
      const errorEl = document.getElementById('error-message');
      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const id = readId();
        const entry = data.find(e => slugifyAntenna(e) === id);
        if (!entry) {
          errorEl.style.display = 'block';
          errorEl.textContent = 'Antenna not found.';
          return;
        }
        currentEntry = entry;

        const editLink = document.getElementById('edit-link');
        const editParams = new URLSearchParams(window.location.search);
        editParams.set('id', slugifyAntenna(entry));
        editLink.href = `edit.html?${editParams.toString()}`;
        editLink.style.display = 'inline-flex';

        const productName = String(entry.name || '').trim();
        const vendor = String(entry.vendor || '').trim();
        const sku = String(entry.sku || '').trim();
        const legacySku = String(entry.legacy_sku || '').trim();
        const vendorSku = `${vendor} ${sku}`.trim();
        const heading = productName || vendorSku || String(entry.form || '').trim() || 'Antenna Details';
        document.getElementById('title-header').textContent = heading;
        document.title = `${heading} — AntennaComparison`;

        const parts = document.getElementById('part-numbers');
        parts.replaceChildren();
        addPartNumber(parts, sku);
        if (legacySku) addPartNumber(parts, legacySku, 'Former AccelTex part number');

        const imgUrl = safeUrl(entry.image_url, { allowRelative: true });
        const imageWrapper = document.getElementById('image-container');
        const imageEl = document.getElementById('antenna-image');
        const heroZoom = document.getElementById('hero-zoom');
        if (imgUrl) {
          imageEl.src = imgUrl;
          imageEl.alt = heading;
          imageWrapper.style.display = 'block';
          heroZoom.hidden = false;
          heroZoom.setAttribute('aria-label', `Expand product photo for ${heading}`);
          heroZoom.onclick = () => openLightbox(imgUrl, heading);
          imageEl.onerror = () => {
            imageWrapper.style.display = 'none';
            heroZoom.hidden = true;
          };
        }

        const actions = document.getElementById('actions-inline');
        actions.className = 'detail-actions';
        const sheets = Array.isArray(entry.datasheet_urls) ? entry.datasheet_urls : [];
        sheets.forEach(sheet => {
          const href = safeUrl(sheet.url);
          if (!href) return;
          const a = document.createElement('a');
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'btn-inline-action';
          a.innerHTML = `<span>${sheet.label || 'Datasheet'}</span>`;
          actions.appendChild(a);
        });

        const detailsEl = document.getElementById('details');
        detailsEl.innerHTML = '';
        PUBLIC_FIELDS.forEach(([key, label]) => {
          if (INTERNAL_ONLY_KEYS.has(key)) return;
          if (!Object.prototype.hasOwnProperty.call(entry, key)) return;
          if (entry[key] == null || entry[key] === '') return;
          const keyDiv = document.createElement('div');
          keyDiv.className = 'key';
          keyDiv.textContent = label;
          const valDiv = document.createElement('div');
          valDiv.className = 'val';
          if (COPYABLE_SKU_KEYS.has(key)) {
            valDiv.classList.add('val-with-copy');
            // Copy the raw SKU string even if the value is also rendered as a link elsewhere.
            appendCopyableSku(valDiv, entry[key]);
          } else {
            valDiv.textContent = formatField(key, entry[key]);
          }
          detailsEl.appendChild(keyDiv);
          detailsEl.appendChild(valDiv);
        });

        // Section order: specs → included parts → radiation patterns → dimensions → additional photos
        const included = document.getElementById('included');
        if (Array.isArray(entry.included_parts) && entry.included_parts.length) {
          const section = document.createElement('div');
          section.className = 'spec-section';
          const h = document.createElement('h3');
          h.textContent = 'Included parts';
          section.appendChild(h);
          const list = document.createElement('ul');
          list.className = 'mount-list';
          entry.included_parts.forEach(part => {
            if (!part) return;
            const li = document.createElement('li');
            const name = document.createElement('div');
            name.className = 'mount-name';
            const qty = part.qty ? `${part.qty}× ` : '';
            name.textContent = `${qty}${part.item || ''}`.trim();
            li.appendChild(name);
            if (part.part_number) {
              const pn = document.createElement('div');
              pn.className = 'mount-nums';
              pn.textContent = part.part_number;
              li.appendChild(pn);
            }
            list.appendChild(li);
          });
          section.appendChild(list);
          included.appendChild(section);
        }

        addGallery(document.getElementById('patterns'), 'Radiation patterns', entry.pattern_images, 'pattern');
        // Only explicit mechanical drawings under Dimensions. Assembly renders fold into
        // Additional product photos; unlabeled/photo dims are omitted (see dimension_image_kind).
        if (entry.dimension_image_url && dimensionImageKind(entry) === 'mechanical') {
          addGallery(
            document.getElementById('dimensions'),
            'Mechanical drawing',
            [{ label: 'Mechanical drawing', url: entry.dimension_image_url }],
            'dimension'
          );
        }
        addGallery(
          document.getElementById('photos'),
          'Additional product photos',
          extraProductPhotos(entry),
          'photo'
        );

        const sourcesEl = document.getElementById('sources');
        if (Array.isArray(entry.sources) && entry.sources.length) {
          const section = document.createElement('div');
          section.className = 'spec-section';
          const h = document.createElement('h3');
          h.textContent = 'Sources';
          section.appendChild(h);
          const list = document.createElement('ul');
          list.className = 'notes-list';
          entry.sources.forEach(src => {
            const li = document.createElement('li');
            const href = safeUrl(src.url);
            if (href) {
              const a = document.createElement('a');
              a.href = href;
              a.target = '_blank';
              a.rel = 'noopener noreferrer';
              a.textContent = src.label || src.id || href;
              li.appendChild(a);
            } else {
              li.textContent = src.label || src.id || 'Source';
            }
            list.appendChild(li);
          });
          section.appendChild(list);
          sourcesEl.appendChild(section);
        }

        // Guard: never surface field_notes / internal_notes / compatible_aps in the UI
      } catch (err) {
        errorEl.style.display = 'block';
        errorEl.textContent = 'Failed to load antenna: ' + err.message;
      }
    }

    document.getElementById('export-csv').addEventListener('click', exportToCsv);
    bindLightboxControls();
    const params = new URLSearchParams(window.location.search);
    params.delete('id');
    const backQs = params.toString();
    document.getElementById('back-link').href = backQs ? `index.html?${backQs}` : 'index.html';
    load();
  </script>
</body>
</html>
