name: Validate Antenna Data

on:
  push:
    paths:
      - 'antenna_data.json'
      - 'antenna_catalog.json'
      - 'antenna_catalog.meta.json'
      - 'antenna_template.json'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'fonts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'antenna_data.json'
      - 'antenna_catalog.json'
      - 'antenna_catalog.meta.json'
      - 'antenna_template.json'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'fonts/**'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate antenna data
        run: node .github/scripts/validate-data.js
      - name: Verify public catalog artifact
        run: node .github/scripts/build-public-catalog.js --check
      - name: Test edit and submit helpers
        run: node .github/scripts/test-antenna-submit.js
      - name: Test datasheet label XSS guard
        run: node .github/scripts/test-datasheet-label-xss.js
