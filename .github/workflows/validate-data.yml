name: Validate Antenna Data

on:
  push:
    paths:
      - 'antenna_data.json'
      - 'antenna_catalog.json'
      - 'antenna_catalog.meta.json'
      - 'antenna_template.json'
      - 'data/compatibility/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'fonts/**'
      - 'images/**'
      - 'SECURITY.md'
      - '404.html'
      - 'robots.txt'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths:
      - 'antenna_data.json'
      - 'antenna_catalog.json'
      - 'antenna_catalog.meta.json'
      - 'antenna_template.json'
      - 'data/compatibility/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'fonts/**'
      - 'images/**'
      - 'SECURITY.md'
      - '404.html'
      - 'robots.txt'
      - '.github/workflows/**'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate antenna data
        run: node .github/scripts/validate-data.js
      - name: Validate compatibility data
        run: node .github/scripts/validate-compatibility.js
      - name: Verify public catalog artifact
        run: node .github/scripts/build-public-catalog.js --check
      - name: Verify compatibility index artifact
        run: node .github/scripts/build-compatibility-index.js --check
      - name: Test edit and submit helpers
        run: node .github/scripts/test-antenna-submit.js
      - name: Test compatibility matcher
        run: node .github/scripts/test-compatibility-matcher.js
      - name: Test datasheet label XSS guard
        run: node .github/scripts/test-datasheet-label-xss.js
      - name: Test URL sanitizer unification
        run: node .github/scripts/test-url-sanitizer.js
      - name: Test detail Back session helpers
        run: node .github/scripts/test-detail-back.js
      - name: Test per-port pattern grouping
        run: node .github/scripts/test-pattern-ports.js
      - name: Test AP Comparison links
        run: node .github/scripts/test-ap-links.js
      - name: Test alternate part numbers and old detail links
        run: node .github/scripts/test-alt-sku.js
      - name: Test HTML sink inventory
        run: node .github/scripts/test-html-sinks.js
