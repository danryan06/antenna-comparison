name: Validate Antenna Data

on:
  push:
    branches: [main]
    paths: &validated-paths
      - 'antenna_data.json'
      - 'antenna_catalog.json'
      - 'antenna_catalog.meta.json'
      - 'antenna_template.json'
      - 'data/compatibility/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'js/**'
      - 'css/**'
      - 'fonts/**'
      - 'images/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - '.nvmrc'
      - 'SECURITY.md'
      - 'robots.txt'
      - '.github/workflows/**'
      - '.github/scripts/**'
  pull_request:
    paths: *validated-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # package.json "test" is the single list of validators and tests; it needs
      # no installed packages, so it runs before npm ci.
      - name: Run validators and tests
        run: npm test
      - name: Install dev dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
