name: Refresh site meta

# Rebuilds site-meta.json (per-entry "last edited" dates and the Recent
# changes list) whenever main changes, and commits it back if it differs.
on:
  push:
    branches: [main]
    paths-ignore:
      - site-meta.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-meta
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for git blame and log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Generate site-meta.json
        run: node .github/scripts/generate-site-meta.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- site-meta.json; then
            echo "site-meta.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site-meta.json
          git commit -m "Refresh site-meta.json"
          git pull --rebase origin main
          git push origin HEAD:main
