name: Process Antenna Submissions

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: antenna-submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  apply-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event.issue.state == 'open' &&
      github.event.label.name == 'antenna-submission' &&
      (startsWith(github.event.issue.title, 'New Antenna:') ||
       startsWith(github.event.issue.title, 'Edit Antenna:'))
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Save issue body and pick submission kind
        id: issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            if (!issue || !issue.body) {
              core.setFailed('Issue body is missing.');
              return;
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/antenna-issue.md`, issue.body, 'utf8');
            const isEdit = issue.title.startsWith('Edit Antenna:');
            core.setOutput('kind', isEdit ? 'edit' : 'new');
            core.setOutput('verb', isEdit ? 'Edit' : 'Add');
            core.setOutput('branch', `${isEdit ? 'edit-antenna' : 'antenna'}-from-issue-${issue.number}`);

      - name: Apply the submission to antenna_data.json
        id: update-json
        env:
          KIND: ${{ steps.issue.outputs.kind }}
        run: node .github/scripts/apply-antenna-submission.js --data antenna_data.json --body-file "$RUNNER_TEMP/antenna-issue.md" --kind "$KIND"

      # Both generated artifacts depend on antenna_data.json.
      - name: Rebuild public catalog and compatibility index
        run: npm run build

      # Pull requests opened with GITHUB_TOKEN do not trigger other workflows,
      # so run the full CI suite here before opening one.
      - name: Run validators and tests
        run: npm test

      - name: Create pull request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          commit-message: "${{ steps.issue.outputs.verb }} antenna: ${{ steps.update-json.outputs.vendor }} ${{ steps.update-json.outputs.sku }}"
          branch: ${{ steps.issue.outputs.branch }}
          title: "${{ steps.issue.outputs.verb }} antenna from issue #${{ github.event.issue.number }}: ${{ steps.update-json.outputs.vendor }} ${{ steps.update-json.outputs.sku }}"
          body: |
            This PR applies the antenna ${{ steps.issue.outputs.kind == 'edit' && 'edit' || 'submission' }} from issue #${{ github.event.issue.number }}.

            Vendor: **${{ steps.update-json.outputs.vendor }}**
            SKU: **${{ steps.update-json.outputs.sku }}**

            `npm test` passed on the generated change. Review `antenna_data.json`, `antenna_catalog.json`, and `data/compatibility/ap_antenna_index.json` before merging. On edits, maintainer notes, `antenna_id`, `applications`, `rf_interfaces`, and `compatibility_claims` are kept from the existing entry.

            Closes #${{ github.event.issue.number }}
