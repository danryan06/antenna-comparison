# Keeps the SHA-pinned GitHub Actions and the npm dev dependencies (ESLint)
# current. Dependabot updates an action's pin and its "# vN" comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        dependency-type: development
